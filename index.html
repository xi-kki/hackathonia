<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hackathonia</title>
<meta name="description" content="Online and in-person hackathons worldwide, refreshed monthly by an AI crawler.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5c3a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--surface:#fffdf8;--ink:#1d2a22;--muted:#5d6a61;--line:#e3dccd;--brand:#0f5c3a;--brand-ink:#fff;--soft:#e8f0e9;--warn:#a34a12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111814;--surface:#18221c;--ink:#eef3ee;--muted:#a3b0a7;--line:#2a372f;--brand:#4fbf86;--brand-ink:#0b1510;--soft:#1f2e25;--warn:#f0a36b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{padding:48px 0 20px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
h1{font-family:Fraunces,serif;font-weight:650;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:10px 0 8px;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:620px;margin:0}
.meta{margin-top:14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink)}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input[type=search]{flex:1;min-width:200px}
.chip{font:500 13px Inter,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--brand);transform:translateY(-2px)}
.card h3{margin:0;font-size:16px;line-height:1.3}
.org{font-size:13px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.due{font-weight:600;color:var(--brand)}
.due.soon{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 8px}
.src{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);padding:20px 0 40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="https://xi-kki.github.io/">← xi-kki</a>
    <h1>Hackathonia</h1>
    <p class="lede">Online and in-person hackathons worldwide. An AI crawler checks Devpost, ETHGlobal, MLH, DoraHacks, Devfolio, lablab.ai, Unstop and the open web every month.</p>
    <div class="meta" id="meta">Loading…</div>
  </header>
  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Search name, organizer, theme, city" aria-label="Search">
      <select id="sort" aria-label="Sort">
        <option value="due">Deadline: soonest</option>
        <option value="prize">Prize: largest</option>
        <option value="new">Starting soonest</option>
      </select>
    </div>
    <div class="row chips" id="modes"></div>
    <div class="row chips" id="cats"></div>
  </div>
  <main class="grid" id="grid" aria-live="polite"></main>
</div>
<footer><div class="wrap">Always confirm dates and rules on the event page. Data refreshed on the 1st of each month.</div></footer>
<script>
const $ = (s) => document.querySelector(s);
const state = { q: '', mode: 'All', cat: 'All', sort: 'due' };
let DATA = [];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const prizeNum = (p) => { const m = String(p || '').replace(/,/g, '').match(/(\d+(?:\.\d+)?)\s*(k|m)?/i); if (!m) return 0; return +m[1] * (/k/i.test(m[2] || '') ? 1e3 : /m/i.test(m[2] || '') ? 1e6 : 1); };
const fmt = (d) => d ? new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : null;
const daysLeft = (d) => d ? Math.ceil((new Date(d + 'T23:59:59Z') - Date.now()) / 864e5) : null;

function chips(el, items, key) {
  el.innerHTML = items.map((x) => `<button class="chip" aria-pressed="${state[key] === x}" data-v="${esc(x)}">${esc(x)}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('.chip'); if (!b) return; state[key] = b.dataset.v; chips(el, items, key); render(); };
}

function render() {
  const q = state.q.toLowerCase();
  let list = DATA.filter((e) =>
    (state.mode === 'All' || e.mode === state.mode.toLowerCase()) &&
    (state.cat === 'All' || e.categories.includes(state.cat)) &&
    (!q || [e.title, e.organizer, e.location, ...(e.themes || [])].join(' ').toLowerCase().includes(q)));
  const by = { due: (a, b) => (a.end || '9999').localeCompare(b.end || '9999'), prize: (a, b) => prizeNum(b.prize) - prizeNum(a.prize), new: (a, b) => (a.start || '9999').localeCompare(b.start || '9999') };
  list.sort(by[state.sort]);
  $('#grid').innerHTML = list.length ? list.map((e) => {
    const left = daysLeft(e.end);
    const due = left == null ? '' : `<span class="due${left <= 7 ? ' soon' : ''}">${left <= 0 ? 'Ends today' : left + ' days left'}</span>`;
    const when = [fmt(e.start), fmt(e.end)].filter(Boolean);
    return `<a class="card" href="${esc(e.url)}" target="_blank" rel="noopener">
      <span class="src">${esc(e.source)}</span>
      <h3>${esc(e.title)}</h3>
      ${e.organizer ? `<span class="org">${esc(e.organizer)}</span>` : ''}
      <div class="facts">${due}
        ${when.length ? `<span>${esc(when.join(' – '))}</span>` : ''}
        <span>${e.mode === 'online' ? 'Online' : esc(e.location || e.mode)}</span>
        ${e.prize ? `<span><b>${esc(e.prize)}</b></span>` : ''}
      </div>
      <div class="tags">${e.categories.map((c) => `<span class="tag">${esc(c)}</span>`).join('')}</div>
    </a>`;
  }).join('') : '<p class="empty">No hackathons match. Try another filter.</p>';
}

fetch('data/hackathons.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
  DATA = d.events;
  const online = DATA.filter((e) => e.mode === 'online').length;
  $('#meta').innerHTML = `<b>${DATA.length}</b> open or upcoming · <b>${online}</b> online · updated ${esc(fmt(d.updated))}`;
  const counts = {};
  DATA.forEach((e) => e.categories.forEach((c) => (counts[c] = (counts[c] || 0) + 1)));
  chips($('#modes'), ['All', 'Online', 'In-person', 'Hybrid'], 'mode');
  chips($('#cats'), ['All', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])], 'cat');
  render();
}).catch(() => { $('#meta').textContent = 'Could not load data.'; });
$('#q').oninput = (e) => { state.q = e.target.value; render(); };
$('#sort').onchange = (e) => { state.sort = e.target.value; render(); };
</script>
</body>
</html>
